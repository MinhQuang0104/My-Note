name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Label of the container job
  file-change:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
      
    steps: 
      - name: checkout source
        uses: actions/checkout@v4
        with:
            fetch-depth: 0
      - name: path filter
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            infra:
              - 'infra/**'
  # BE job for test syntax and unit test for backend
  backend:
    runs-on: ubuntu-latest
    needs: [file-change]
    if: needs.file-change.outputs.backend == 'true'
    container: node:20-bookworm-slim
   
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, ctype, fileinfo, json, tokenizer, xml, pdo, pdo_mysql, openssl, curl, zip, imagick, swoole
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Copy .env file
        run: |
          cp .env.ci .env
      - name: Install dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress
      - name: Generate application key
        run: |
          php artisan key:generate
      - name: Directory permissions
        run: |
          sudo chown -R $USER:$USER storage bootstrap/cache
          chmod -R 775 storage bootstrap/cache
      - name: phpstan
        run: |
          ./vendor/bin/phpstan analyse --level=5 --memory-limit=1G
      - name: phpinsights
        run: |
          php artisan insights --no-interaction \
          --min-quality=90 --min-complexity=90 \
          --min-architecture=90 --min-style=90 \
          --ansi --format=github-action
      - name: Show DB config
        run: |
          grep DB_ .env
      - name: Run tests
        run: |
          php artisan test  
  #FE job for test syntax and unit test for frontend            
  frontend-test: # job for test syntax and unit test for frontend
    runs-on: ubuntu-latest
    needs: [file-change]
    if: needs.file-change.outputs.frontend == 'true'
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Run Unit Tests
        run: npm run test:unit

  frontend-detect-mess: # job for detect mess in frontend
    runs-on: ubuntu-latest
    needs: [file-change]
    if: needs.file-change.outputs.frontend == 'true'
    name: Detect Vue Mess
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vue Mess Detector Analysis
        uses: brenoepics/vmd-action@v0.0.7
  infra: 
    runs-on: ubuntu-latest
    needs: [file-change]
    if: needs.file-change.outputs.infra == 'true'
    name: Terraform CI
    steps:
      - uses: actions/checkout@v4
      - uses: pipery-dev/pipery-terraform-ci@v1
        with:
          project_path: ./infra
          config_file: .pipery/config.yaml
          terraform_version: latest
          backend_config: 
          var_file: 
          working_directory: .
          skip_sast: false
          skip_sca: false
          skip_lint: false
          skip_validate: false
          skip_plan: false
          skip_version: true
          skip_versioning: true
          skip_release: true
          skip_reintegration: true
          log_file: pipery.jsonl



