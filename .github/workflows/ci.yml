name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Label of the container job
  file-change:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
      
    steps: 
      - name: checkout source
        uses: actions/checkout@v4
        with:
            fetch-depth: 0
      - name: path filter
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            infra:
              - 'infra/**'
  # BE job for test syntax and unit test for backend
  backend:
    runs-on: ubuntu-latest
    needs: [file-change]
    if: needs.file-change.outputs.backend == 'true'
   
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: my_note_test
        ports: 
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d my_note_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, xml, zip, imagick, swoole, pdo_pgsql
          tools: composer
          
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Copy test environment
        working-directory: backend
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=5432/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=my_note_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=postgres/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-ansi --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        working-directory: backend
        run: php artisan key:generate

      - name: Prepare database
        working-directory: backend
        run: php artisan migrate --force

      - name: Set directory permissions
        working-directory: backend
        run: chmod -R 775 storage bootstrap/cache

      - name: PHPStan
        working-directory: backend
        run: ./vendor/bin/phpstan analyse --level=5 --memory-limit=1G

      - name: PHP Insights
        working-directory: backend
        run: |
          php artisan insights --no-interaction \
            --min-quality=90 --min-complexity=90 \
            --min-architecture=90 --min-style=90 \
            --ansi --format=github-action

      - name: Run tests
        working-directory: backend
        run: php artisan test
  #FE job for test syntax and unit test for frontend            
  frontend-test: # job for test syntax and unit test for frontend
    runs-on: ubuntu-latest
    needs: [file-change]
    if: needs.file-change.outputs.frontend == 'true'
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Run Unit Tests
        run: npm run test:unit

  frontend-detect-mess: # job for detect mess in frontend
    runs-on: ubuntu-latest
    needs: [file-change]
    if: needs.file-change.outputs.frontend == 'true'
    name: Detect Vue Mess
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vue Mess Detector Analysis
        uses: brenoepics/vmd-action@v0.0.7
  infra: 
    runs-on: ubuntu-latest
    needs: [file-change]
    if: needs.file-change.outputs.infra == 'true'
    name: Terraform CI
    steps:
      - uses: actions/checkout@v4
      - uses: pipery-dev/pipery-terraform-ci@v1
        with:
          project_path: ./infra
          config_file: .pipery/config.yaml
          terraform_version: latest
          backend_config: 
          var_file: 
          working_directory: .
          skip_sast: false
          skip_sca: false
          skip_lint: false
          skip_validate: false
          skip_plan: false
          skip_version: true
          skip_versioning: true
          skip_release: true
          skip_reintegration: true
          log_file: pipery.jsonl



